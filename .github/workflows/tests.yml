name: tests

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  unit:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon0 xvfb
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          # Qt has no display on the runner; without this the suite aborts
          # before any assertion is reported.
          QT_QPA_PLATFORM: offscreen
        # `pynput` raises on import without an X server, which takes the
        # dictation and hotkey tests with it, so the run gets a virtual
        # one. `not integration` is what lets a single hardware-bound
        # test be held back without its whole file leaving CI.
        run: |
          xvfb-run -a python -m pytest -q -m "unit and not integration"

