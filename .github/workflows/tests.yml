name: tests

on:
  pull_request:
  push:
    # Slice branches run CI on push. Without this a branch is verified
    # only once a pull request exists, so work that is pushed and not yet
    # proposed has no automated check anywhere - which is exactly the
    # state this branch was in after its first pull request merged.
    branches: [ main, 'claude/**' ]

jobs:
  unit:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    # A bound on wasted runner minutes, and nothing more. It is not a
    # health signal and must not be read as one: four times in one branch
    # a duration reported a problem that was not in the tree. The same
    # commit finished in 116s on one runner and was killed at a
    # ten-minute ceiling on another, then killed again at twenty; the
    # suite once took 2545s in a container that had just run it in 103s.
    # These runners degrade by a large multiple rather than hanging, so
    # no finite ceiling separates a sick runner from a slow suite.
    #
    # What replaced it is a test count. `COLLECTED_FLOOR` in
    # tests/test_ci_selection.py asserts that CI still selects as many
    # tests as it did, which is the thing duration was being asked to
    # detect and cannot be made flaky by a struggling runner.
    #
    # `--durations` stays as diagnostics: useful to read, never a gate.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon0 xvfb
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The test runner is not a runtime dependency, so it is not in
          # requirements.txt. This job needs it, and saying so here is what
          # keeps a user's install free of our toolchain.
          python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        env:
          # Qt has no display on the runner; without this the suite aborts
          # before any assertion is reported.
          QT_QPA_PLATFORM: offscreen
        # `pynput` raises on import without an X server, which takes the
        # dictation and hotkey tests with it, so the run gets a virtual
        # one. `not needs_hardware` is what lets a single test that wants
        # a sound card be held back without its whole file leaving CI.
        run: |
          # `--durations` catches the slide, `timeout-minutes` catches
          # the cliff. Without the first, the only signal that the suite
          # is degrading is someone noticing the wall-clock by eye.
          xvfb-run -a python -m pytest -q -m "unit and not needs_hardware" --durations=10

