name: Release

on:
  # Manual only. Publishing is a decision, and on `push: main` it was a
  # side effect of merging: two releases went out in two days that nobody
  # asked for, and one of them (v1.13.1) is public with no binaries
  # attached, because `semantic-release` creates the release before the
  # builds run and `release-main` attaches whatever exists afterwards.
  #
  # Gating the trigger does not fix that ordering, which is still wrong
  # and worth its own change. It does mean the ordering can no longer be
  # tripped by accident.
  #
  # To publish: run this workflow from the Actions tab against `main`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Semantic versioning analysis (main only) ────────────────────────────
  # ── What version would this be? (main only, publishes nothing) ─────────
  #
  # This runs `semantic-release --dry-run`, which analyses the commits and
  # reports the next version without creating a tag or a release. That is
  # what lets the builds run *before* anything is published.
  #
  # The previous shape published first and built afterwards, which is how
  # v1.13.1 became a public release with no binaries: the builds failed,
  # every downstream guard behaved correctly and refused to attach
  # binaries it did not have, and none of that could un-publish a release
  # that already existed. A release attempt is not reversible in place, so
  # nothing irreversible may happen until the reversible parts have passed.
  next-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      will_publish: ${{ steps.dry.outputs.will_publish }}
      version: ${{ steps.dry.outputs.version }}
      git_tag: ${{ steps.dry.outputs.git_tag }}

    permissions:
      # Write, even though this job publishes nothing. `--dry-run` still
      # runs semantic-release's preflight, which includes
      # `git push --dry-run` to confirm it *could* push, and that check
      # needs the permission it is testing for. With `contents: read` the
      # dry run aborts on EGITNOPERMISSION before working out a version,
      # every downstream job skips, and the release silently does nothing.
      #
      # `--dry-run` is what keeps this safe: it is the flag that stops a
      # tag or a release being created, not the token scope.
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🐍 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@22 \
            @semantic-release/github@9 \
            conventional-changelog-conventionalcommits@7

      - name: 🔎 Work out the next version
        id: dry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npx semantic-release --dry-run --debug > dry.log 2>&1 || true

          # Dry-run says "The next release version is X". No tag, no release.
          VERSION=$(sed -n 's/.*The next release version is \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' dry.log | head -1)
          if [ -n "$VERSION" ]; then
            echo "will_publish=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "git_tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "🔎 Next version would be $VERSION - building before publishing anything"
          else
            echo "will_publish=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No releasable changes found"
          fi

          cat dry.log

  # ── Build desktop apps (develop only; main builds stable-stamped below) ─
  build-desktop:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: dev-${{ github.sha }}
      channel: develop
      smoke_test: false

  # ── Build stable-stamped desktop apps (main only) ───────────────────────
  # The version isn't known until semantic-release runs on main, so the
  # smoke-tested artifacts (built as dev/develop before the fast-forward)
  # can't be published as the stable release — they would stamp stable
  # installs onto the develop channel and get them offered develop builds.
  # Rebuild the same (already smoke-tested) commit with the real version so
  # stable installs report channel "stable" and only see stable updates.
  build-stable:
    needs: [next-version]
    if: needs.next-version.outputs.will_publish == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      version: ${{ needs.next-version.outputs.version }}
      channel: stable
      smoke_test: false

  # ── Create versioned GitHub release (main only, from stable-stamped builds) ─
  release-main:
    needs: [next-version, build-stable]
    runs-on: ubuntu-latest
    # No `always()`. Every build must have succeeded before this job runs,
    # because this is the job that creates the tag and the public release
    # and there is no undoing either.
    if: needs.next-version.outputs.will_publish == 'true' && needs.build-stable.result == 'success'

    permissions:
      contents: write
      actions: read  # gh run download reads this run's artifacts

    steps:
      - name: 📥 Download artifacts from build-stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download every platform artifact that build-stable produced in
          # this run. Fail loudly if any are missing — publishing a release
          # without its binaries is worse than a failed job.
          set -euo pipefail
          missing=0
          for name in Jarvis-Windows Jarvis-macOS-arm64 Jarvis-macOS-x64 Jarvis-Linux; do
            echo "Downloading $name..."
            if ! gh run download ${{ github.run_id }} --repo ${{ github.repository }} \
              --name "$name" \
              --dir artifacts; then
              echo "::error::Missing artifact $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more build artifacts are missing; not publishing a release without binaries."
            exit 1
          fi

      - name: 📋 List available artifacts
        run: |
          echo "Available artifacts:"
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort || echo "(none)"

      # Everything above this line is reversible. Everything below creates
      # a tag and a public release, and cannot be undone in place - so the
      # binaries are already downloaded and verified present before the
      # first irreversible step runs.
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: repo

      - name: 🐍 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@22 \
            @semantic-release/github@9 \
            conventional-changelog-conventionalcommits@7

      - name: 🏷️ Publish the release
        id: semantic
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npx semantic-release --debug > release_output.log 2>&1 || true

          if grep -q "Published release" release_output.log; then
            VERSION=$(grep "Published release" release_output.log | sed -n 's/.*Published release \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
            echo "git_tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "✅ Published $VERSION, with binaries already built and waiting"
          else
            # The dry run said there was a version to cut, so nothing here
            # should be a no-op. Failing is right: a silent skip would leave
            # built binaries with no release to attach them to.
            echo "::error::semantic-release published nothing, though the dry run expected ${{ needs.next-version.outputs.version }}"
            cat release_output.log
            exit 1
          fi

          cat release_output.log

      - name: 📎 Attach binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semantic.outputs.git_tag }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          fail_on_unmatched_files: false
          append_body: true
          body: |

            ---

            ### ⚡ Prerequisites
            - [Ollama](https://ollama.com/download) (default), or any OpenAI-compatible server (LM Studio, Jan, llama.cpp, vLLM, oMLX, LocalAI, …)

            ### 📦 Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `Jarvis-Windows-x64.zip` | Extract → Run `Jarvis.exe` |
            | **macOS (Apple Silicon)** | `Jarvis-macOS-arm64.zip` | Extract → Move to Applications → Right-click → Open |
            | **macOS (Intel)** | `Jarvis-macOS-x64.zip` | Extract → Move to Applications → Right-click → Open |
            | **Linux** | `Jarvis-Linux-x64.tar.gz` | `tar -xzf` → Run `./Jarvis/Jarvis` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧭 Mirror stable build to the develop "latest" channel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Serve the stable build through the "latest" (develop) channel so
          # develop builds, and installs mis-stamped as develop (e.g. v2.2.1),
          # can update to stable through their normal update flow. The next
          # develop push re-publishes "latest" with a fresh develop build, so
          # the window closes by itself.
          FILES=$(find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "::warning::No artifacts to mirror to 'latest'"
            exit 0
          fi
          gh release upload latest $FILES --clobber --repo ${{ github.repository }}

  # ── Create/update "latest" pre-release (develop only) ──────────────────
  release-develop:
    needs: [build-desktop]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/develop'

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 📝 Generate changelog from main
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, using full develop history"
            COMPARE_REF="origin/main"
            SINCE_TEXT="main branch"
          else
            COMPARE_REF="$LATEST_TAG"
            SINCE_TEXT="$LATEST_TAG"
          fi

          echo "Generating changelog comparing to: $COMPARE_REF"

          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo ""
            echo "## 📋 Changelog (since $SINCE_TEXT)"
            echo ""

            FEATURES=$(git log "$COMPARE_REF"..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --grep="^feat" --regexp-ignore-case 2>/dev/null || true)
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo ""
              echo "$FEATURES"
              echo ""
            fi

            FIXES=$(git log "$COMPARE_REF"..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --grep="^fix" --regexp-ignore-case 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo ""
              echo "$FIXES"
              echo ""
            fi

            REFACTOR=$(git log "$COMPARE_REF"..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --grep="^refactor" --regexp-ignore-case 2>/dev/null || true)
            if [ -n "$REFACTOR" ]; then
              echo "### ♻️ Code Refactoring"
              echo ""
              echo "$REFACTOR"
              echo ""
            fi

            DOCS=$(git log "$COMPARE_REF"..HEAD --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --grep="^docs" --regexp-ignore-case 2>/dev/null || true)
            if [ -n "$DOCS" ]; then
              echo "### 📝 Documentation"
              echo ""
              echo "$DOCS"
              echo ""
            fi

            OTHER=$(git log "$COMPARE_REF"..HEAD --pretty=format:"%s|%h|%H" 2>/dev/null | grep -v -i -E "^(feat|fix|refactor|docs)" | while IFS='|' read -r subject short full; do
              if [ -n "$subject" ]; then
                echo "* $subject ([$short](https://github.com/${{ github.repository }}/commit/$full))"
              fi
            done || true)
            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo ""
              echo "$OTHER"
              echo ""
            fi

            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: 📋 List available artifacts
        run: |
          echo "Available artifacts:"
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort || echo "(none)"

      # Everything above this line is reversible. Everything below creates
      # a tag and a public release, and cannot be undone in place - so the
      # binaries are already downloaded and verified present before the
      # first irreversible step runs.
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: repo

      - name: 🐍 Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@22 \
            @semantic-release/github@9 \
            conventional-changelog-conventionalcommits@7

      - name: 🏷️ Publish the release
        id: semantic
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          npx semantic-release --debug > release_output.log 2>&1 || true

          if grep -q "Published release" release_output.log; then
            VERSION=$(grep "Published release" release_output.log | sed -n 's/.*Published release \([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
            echo "git_tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "✅ Published $VERSION, with binaries already built and waiting"
          else
            # The dry run said there was a version to cut, so nothing here
            # should be a no-op. Failing is right: a silent skip would leave
            # built binaries with no release to attach them to.
            echo "::error::semantic-release published nothing, though the dry run expected ${{ needs.next-version.outputs.version }}"
            cat release_output.log
            exit 1
          fi

          cat release_output.log

      - name: 📝 Create/Update Latest Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Development Build
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          fail_on_unmatched_files: false
          draft: false
          prerelease: true
          body: |
            🚀 **Latest development build from develop branch**

            This is an automated build from the latest commit on develop.
            These builds may be unstable. For stable releases, use versioned releases.

            ---
            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### ⚡ Prerequisites
            - [Ollama](https://ollama.com/download) (default), or any OpenAI-compatible server (LM Studio, Jan, llama.cpp, vLLM, oMLX, LocalAI, …)

            ### 📦 Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `Jarvis-Windows-x64.zip` | Extract → Run `Jarvis.exe` |
            | **macOS (Apple Silicon)** | `Jarvis-macOS-arm64.zip` | Extract → Move to Applications → Right-click → Open |
            | **macOS (Intel)** | `Jarvis-macOS-x64.zip` | Extract → Move to Applications → Right-click → Open |
            | **Linux** | `Jarvis-Linux-x64.tar.gz` | `tar -xzf` → Run `./Jarvis/Jarvis` |

            **Branch**: develop
            **Commit**: ${{ github.sha }}
            **Date**: ${{ github.event.head_commit.timestamp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
